# Android64-only build for Fusion
name: Build Fusion

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Fusion
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          combine: true
          export-pdb: true
          export-symbols: true
          target: Android64
          build-config: Release

  package:
    name: Package Android64 build
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Combine build
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Android64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fusion-Android64
          path: ${{ steps.build.outputs.build-output }}
